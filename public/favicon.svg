<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c7c8d"/>
      <stop offset="100%" stop-color="#0c7c8d"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Bold B — stem + two lobes as bezier D-shapes -->
  <!-- Left stem -->
  <rect x="7.5" y="7" width="5" height="18" fill="white"/>
  <!-- Upper lobe (D shape) -->
  <path d="M 12 7 H 18 C 25 7 25 16 18 16 H 12 Z" fill="white"/>
  <!-- Lower lobe (D shape, slightly wider) -->
  <path d="M 12 15.5 H 19 C 27 15.5 27 25 19 25 H 12 Z" fill="white"/>
</svg>
